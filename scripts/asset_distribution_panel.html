<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资产分布</title><style>
:root{--ink:#152b43;--muted:#6c7c8d;--line:#e1e8ef;--bg:#eef3f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 'PingFang SC','Microsoft YaHei',sans-serif}header{background:white;padding:16px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}header b{font-size:17px}header span{font-size:11px;color:var(--muted)}main{max-width:1440px;margin:auto;padding:20px 28px 30px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.muted{font-size:11px;color:var(--muted)}select,button{font:inherit;color:inherit}select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:white}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #6aa8c4;outline-offset:3px}.overview{display:grid;grid-template-columns:230px 1fr;border-radius:10px;border:1px solid var(--line);overflow:hidden;background:white}.total{padding:22px;background:var(--ink);color:white;display:flex;flex-direction:column;justify-content:center}.total span{color:#bdcbd8;font-size:12px}.total strong{font:600 38px/1.5 'Helvetica Neue',sans-serif;font-variant-numeric:tabular-nums}.assets{padding:20px 24px}.asset-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.asset-label{font-size:13px}.asset-value{font:600 29px/1.5 'Helvetica Neue',sans-serif;font-variant-numeric:tabular-nums}.asset-share{font-size:11px;color:var(--color)}.stack{height:16px;border-radius:4px;overflow:hidden;display:flex;background:#edf2f7;margin-top:14px}.segment{height:100%;background:var(--color)}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}.panel{padding:18px 20px;background:white;border:1px solid var(--line);border-radius:9px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px}.head b{font-size:14px}.row{display:grid;grid-template-columns:115px 1fr 63px 55px;gap:8px;align-items:center;padding:4px 0;font-size:14.3px}.track{height:10px;background:#edf2f7;border-radius:3px;overflow:hidden}.fill{height:100%;background:var(--color);border-radius:3px}.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}.pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--color)}.fund-name{display:flex;gap:5px;align-items:center;white-space:nowrap}.dot{width:7px;height:7px;background:var(--color);border-radius:2px;display:inline-block}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:12px}.legend span{display:flex;gap:6px;align-items:center}.history{margin-top:18px}.chart-scroll{overflow-x:auto}.history-chart{display:block;width:100%;height:285px}.history-chart text{fill:var(--muted);font-size:10px;font-family:'PingFang SC',sans-serif}.hit{cursor:crosshair}.tooltip{position:fixed;z-index:10;width:320px;max-width:calc(100vw - 20px);background:white;border:1px solid var(--line);padding:12px;border-radius:7px;box-shadow:0 5px 22px #152b4326;pointer-events:none}.tooltip[hidden]{display:none}.tooltip table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}.tooltip th,.tooltip td{padding:5px 3px;text-align:right;border-bottom:1px solid #edf1f5}.tooltip th:first-child,.tooltip td:first-child{text-align:left}.tooltip th{font-weight:400;color:var(--muted)}.note{font-size:11px;color:var(--muted);margin-top:15px;line-height:1.8}.warning{font-size:10px;color:#936632;margin-top:10px}details{font-size:11px;color:var(--muted);margin-top:14px}summary{cursor:pointer}
@media(max-width:1100px){.panels{grid-template-columns:1fr}.row{grid-template-columns:115px 1fr 72px 63px}}
@media(max-width:650px){header{padding:14px 16px}main{padding:16px 12px}.toolbar{align-items:flex-start;flex-direction:column}.overview{grid-template-columns:1fr}.total{padding:16px 20px}.total strong{font-size:32px}.assets{padding:16px}.asset-cards{gap:10px}.asset-value{font-size:23px}.asset-label{font-size:12px}.panel{padding:16px 13px}.head{flex-wrap:wrap}.row{grid-template-columns:110px 1fr 56px 51px;font-size:13px}.history-chart{min-width:660px}.legend{gap:10px}}
.total{background:var(--ink);color:#fff;border-right:1px solid var(--line)}.total strong{color:#fff}.asset-value,.asset-share,.num,.pct,#period,.head .muted{color:#000}.total span{color:#bdcbd8}.head{margin-bottom:8px}.panel{padding-top:15px;padding-bottom:15px}
.asset-value-line{display:flex;align-items:baseline;gap:12px;flex-wrap:nowrap;white-space:nowrap}.asset-value-line .asset-share{font-size:12px;color:#000}@media(max-width:650px){.asset-value-line{gap:6px}.asset-value-line .asset-share{font-size:10px}}
</style></head><body><main><div class="toolbar"><label>数据时点 <select id="period" aria-label="数据时点"></select></label><span class="muted">2023 年起 · 余额：原表数值（单位未注明）</span></div><section class="overview"><div class="total"><span>消金资产余额合计</span><strong id="total"></strong><span>白条＋金条＋白条取现</span></div><div class="assets"><div id="asset-cards" class="asset-cards"></div><div id="asset-stack" class="stack"></div></div></section><div id="fund-panels" class="panels"></div><details><summary>数据口径与缺失</summary><p>各资金类别占比＝该类别余额／该资产原表合计。空白单元格为未披露，不当作零。</p><p>余额为存量口径，区别于累计发行量；本页与动态池表的统计范围可能不同。</p></details><div class="note" id="source"></div></main><script id="distribution-data" type="application/json">__DATA__</script><script>
'use strict';const D=JSON.parse(document.getElementById('distribution-data').textContent),$=id=>document.getElementById(id);const AC={'白条':'#285f9e','金条':'#1a8b8a','白条取现':'#bd8241'},FC={'赊销':'#285f9e','信托':'#1a8b8a','京东消金':'#7a6ba9','小贷':'#bd8241','助贷/联合贷':'#539bc4'};const fmt=v=>v===null?'—':v.toLocaleString('en-US',{maximumFractionDigits:0}),pct=(v,t)=>v===null?'—':(v/t*100).toFixed(1)+'%';let index=D.periods.length-1;
function parts(a,i){return a.parts.map(p=>({name:p.name,value:p.values[i]}));}
function render(){const total=D.assets.reduce((s,a)=>s+a.totals[index],0);$('total').textContent=fmt(total);$('asset-cards').innerHTML=D.assets.map(a=>`<div style="--color:${AC[a.name]}"><div class="asset-label">${a.name}</div><div class="asset-value-line"><div class="asset-value">${fmt(a.totals[index])}</div><div class="asset-share">${pct(a.totals[index],total)}</div></div></div>`).join('');$('asset-stack').innerHTML=D.assets.map(a=>`<span class="segment" style="--color:${AC[a.name]};width:${a.totals[index]/total*100}%" title="${a.name} ${fmt(a.totals[index])} ${pct(a.totals[index],total)}"></span>`).join('');$('fund-panels').innerHTML=D.assets.map(a=>{const rows=parts(a,index);return `<section class="panel"><div class="head"><b>${a.name}</b></div>${rows.map(p=>`<div class="row" style="--color:${FC[p.name]}"><span class="fund-name"><i class="dot"></i>${p.name}</span><div class="track"><div class="fill" style="width:${p.value===null?0:p.value/a.totals[index]*100}%"></div></div><span class="num">${fmt(p.value)}</span><span class="pct">${pct(p.value,a.totals[index])}</span></div>`).join('')}</section>`}).join('');}
$('period').innerHTML=D.periods.map((p,i)=>`<option value="${i}" ${i===index?'selected':''}>${p.date.slice(0,7)}</option>`).reverse().join('');$('period').addEventListener('change',e=>{index=+e.target.value;render()});let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(render,100)});$('source').textContent='来源：JoySpace「资产余额」 · 读取日期 '+D.retrievedAt;render();
</script></body></html>
