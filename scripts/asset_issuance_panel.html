<body>
<main>
<div class="toolbar"><label>统计年份 <select id="issuance-year" aria-label="统计年份"><option data-year="2026" value="2026">2026 年</option><option data-year="2025" value="2025">2025 年</option><option data-year="compare" value="compare">两年对比</option></select></label><div class="period" id="period"></div></div>
<section id="year-view">
<div class="overview"><div class="total-block"><p id="total-label">2026 年累计发行</p><div class="total-value"><span id="total"></span><small>亿元</small></div><div class="count" id="project-count"></div></div><div class="channels"><div class="channel-cards" id="channel-cards"></div><div id="channel-stack" class="stack" aria-label="发行渠道规模占比"></div><div class="stack-note"><span id="stack-caption">四个渠道合计 = 当年发行总规模</span><span>金额单位：亿元</span></div></div></div>
<div class="content-grid">
<section class="panel" id="group-panel"><div class="panel-head"><span class="channel-meta">大类资产累计发行 · 亿元</span><span class="channel-meta">占比：该大类 / 当年发行合计</span></div><div class="group-grid" id="group-chart"></div><div id="group-other" hidden></div></section>
<section class="panel"><div class="panel-head"><span class="channel-meta" id="chart-count">全部资产 · 亿元</span><div class="chart-tools"><span class="channel-meta">占比：各渠道 / 该类资产合计</span><input type="search" id="search" placeholder="搜索资产类型" aria-label="搜索资产类型"><select id="chart-sort" aria-label="资产排序"><option value="total">按总规模</option><option value="交易所">按交易所</option><option value="银行间">按银行间</option><option value="非标">按非标</option><option value="保登">按保登</option></select></div></div><div class="legend" id="legend" style="margin-bottom:14px"></div><div class="chart-grid" id="asset-chart"></div></section>

</div>
</section>
<section id="compare-view" class="content-grid" hidden><div class="panel"><div class="panel-head"><div class="legend" id="compare-legend"></div></div><div class="compare-chart" id="compare-chart"></div><div class="table-wrap" style="margin-top:22px"><table><thead><tr><th>年份</th><th>交易所</th><th>银行间</th><th>非标</th><th>保登</th><th>合计</th></tr></thead><tbody id="compare-body"></tbody></table></div><div class="comparison-total" id="compare-total"></div></div><div class="panel" id="group-compare-panel"><div class="panel-head"><span class="channel-meta">大类资产 · 亿元</span><div class="legend"><span><i class="dot" style="--color:#9aadc1"></i>2025 同期</span><span><i class="dot" style="--color:#285f9e"></i>2026 累计</span></div></div><div id="group-compare-chart"></div></div></section>

<div class="footer"><span id="source"></span></div>
</main>
<dialog id="projects"><div class="panel-head"><div><h2 id="dialog-title"></h2><p id="dialog-subtitle"></p></div><button class="close" id="close-dialog">关闭</button></div><div class="dialog-body"><table><thead><tr><th>项目名称</th><th>资产类型</th><th>发行场所</th><th>簿记日期</th><th>规模（亿）</th></tr></thead><tbody id="project-body"></tbody></table></div></dialog>
<script id="issuance-data" type="application/json">__DEMO_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById("issuance-data").textContent);
const channels=['交易所','银行间','非标','保登'];
const colors={'交易所':'#285f9e','银行间':'#1a8b8a','非标':'#bd8241','保登':'#7a6ba9','待补充':'#acb5bf'};
const rgb={'交易所':'40,95,158','银行间':'26,139,138','非标':'189,130,65','保登':'122,107,169'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const pct=(n,total)=>total?(100*n/total).toFixed(1)+'%':'0.0%';
let year='2026',sort='total';
const legend=()=>channels.map(c=>`<span><i class="dot" style="--color:${colors[c]}"></i>${c}</span>`).join('');
function segments(d,total){return [...channels,'待补充'].filter(c=>d[c]>0).map(c=>`<span class="stack-seg ${c==='待补充'?'pending-fill':''}" style="--color:${colors[c]};width:${d[c]/total*100}%" title="${c} · ${fmt(d[c])} 亿 · ${pct(d[c],total)}"></span>`).join('');}
function render(){
 $('issuance-year').value=year;
 $('year-view').hidden=year==='compare';$('compare-view').hidden=year!=='compare';$('search').value='';sort='total';$('chart-sort').value='total';
 if(year==='compare'){renderCompare();return;}
 const d=DATA[year];
 $('period').innerHTML=`<span><b>${year==='2026'?'年内累计':'全年发行'}</b> · 簿记截至 ${d.asOf}</span><span>${d.count} 期项目</span><span>${d.assets.length} 类资产</span>`;
 $('total-label').textContent=year+' 年累计发行';$('total').textContent=fmt(d.total);$('project-count').textContent=d.count+' 期项目 · '+d.assets.length+' 类资产';
 $('channel-cards').innerHTML=channels.map(c=>{const n=d.channels[c]||0;const count=d.records.filter(r=>r.channel===c).length;return `<button class="channel-card" data-channel="${c}" style="--color:${colors[c]}" aria-label="查看${c}发行项目"><div class="channel-label"><span class="dot"></span>${c}</div><div class="channel-number">${d.channelComplete?fmt(n):'—'}</div><div class="channel-meta">${d.channelComplete?'占 '+pct(n,d.total)+' · '+count+' 期':'渠道信息待补充'}</div></button>`}).join('');
 $('channel-stack').innerHTML=segments(d.channels,d.total);$('stack-caption').textContent=d.channelComplete?'四个渠道合计 = 当年发行总规模':'全部规模暂待补充渠道信息';
 $('legend').innerHTML=d.channelComplete?legend():`<span><i class="dot" style="--color:${colors['待补充']}"></i>渠道待补充</span>`;
 $('source').textContent='数据来源：'+d.source;
 renderGroups();renderChart();
}
function renderGroups(){
 const d=DATA[year];
 $('group-chart').innerHTML=d.groups.filter(g=>g.name!=='其他待归类').map(g=>`<button class="group-item" data-group="${esc(g.name)}" aria-label="${esc(g.name)}累计发行${fmt(g.total)}亿元，查看项目"><div class="group-name">${esc(g.name)}</div><div class="group-value">${fmt(g.total)}<span>${pct(g.total,d.total)}</span></div><div class="group-track"><span style="width:${g.total/d.total*100}%"></span></div><div class="group-meta">${g.count} 期</div></button>`).join('');
 const other=d.groups.find(g=>g.name==='其他待归类');$('group-other').hidden=!other.total;
 $('group-other').innerHTML=other.total?`<button class="group-other-button" data-group="其他待归类">其他待归类 <b>${fmt(other.total)}</b> 亿 · ${pct(other.total,d.total)} · ${esc(other.assets.join('、'))}</button>`:'';
}
function renderChart(){
 const d=DATA[year],q=$('search').value.trim(),assets=d.assets.filter(a=>a.name.includes(q)),max=Math.max(...d.assets.map(a=>a.total),1);
 assets.sort((a,b)=>(sort==='total'?b.total-a.total:(b.channels[sort]||0)-(a.channels[sort]||0))||b.total-a.total);
 $('chart-count').textContent=(q?assets.length+' / '+d.assets.length+' 类资产': '全部 '+d.assets.length+' 类资产')+' · 亿元';
 $('asset-chart').innerHTML=assets.map(a=>`<div class="asset-chart-row"><button class="asset-bar" data-asset="${esc(a.name)}" title="查看${esc(a.name)}发行项目"><span class="asset-bar-name">${esc(a.name)}</span><span class="asset-track"><span class="asset-stack" style="width:${a.total/max*100}%">${segments(a.channels,a.total)}</span></span><span class="asset-num">${fmt(a.total)}</span></button><div class="asset-channel-values">${channels.map(c=>`<button data-asset="${esc(a.name)}" data-channel="${c}" class="asset-channel-value" style="--color:${colors[c]}"><span class="dot"></span><span>${c}</span><b>${fmt(a.channels[c]||0)}</b><span class="asset-channel-pct">${pct(a.channels[c]||0,a.total)}</span></button>`).join('')}</div></div>`).join('') || '<div class="empty">没有找到该资产，请换一个关键词。</div>';
}
function yoy(current,previous){
 if(!previous)return current?'新增（同期为0）':'—';
 const change=(current/previous-1)*100;
 return (change>0?'+':'')+change.toFixed(1)+'%';
}
function samePeriod(){
 const cutoff='2025'+DATA['2026'].asOf.slice(4);
 const records=DATA['2025'].records.filter(r=>r.date>= '2025-01-01' && r.date<=cutoff);
 const total=records.reduce((s,r)=>s+r.scale,0);
 const groups=Object.fromEntries(DATA['2025'].groups.map(g=>[g.name,records.filter(r=>r.group===g.name).reduce((s,r)=>s+r.scale,0)]));
 const groupCounts=Object.fromEntries(DATA['2025'].groups.map(g=>[g.name,records.filter(r=>r.group===g.name).length]));
 return {cutoff,total,channels:Object.fromEntries(channels.map(c=>[c,records.filter(r=>r.channel===c).reduce((s,r)=>s+r.scale,0)])),groups,groupCounts};
}
function renderCompare(){
 const previous=samePeriod();$('period').innerHTML='<span>2025 年同期 01-01 ~ '+previous.cutoff+'</span><span>2026 年累计截至 '+DATA['2026'].asOf+'</span><span>金额单位：亿元</span>';
 $('compare-legend').innerHTML=legend();
 const bars=[{label:'2025 同期',total:previous.total,channels:previous.channels},{label:'2026 累计',total:DATA['2026'].total,channels:DATA['2026'].channels}];
 const max=Math.max(...bars.map(b=>b.total),1);
 $('compare-chart').innerHTML=bars.map(b=>`<div class="year-bar"><b>${b.label}</b><div class="stack" style="width:${b.total/max*100}%">${segments(b.channels,b.total)}</div><b style="text-align:right">${fmt(b.total)}</b></div>`).join('');
 $('compare-body').innerHTML=`<tr><td>2025（全年）</td>${channels.map(c=>`<td style="color:${colors[c]}">${DATA['2025'].channelComplete?fmt(DATA['2025'].channels[c]||0):'—'}</td>`).join('')}<td>${fmt(DATA['2025'].total)}</td></tr><tr><td>2026（累计）</td>${channels.map(c=>`<td style="color:${colors[c]}">${DATA['2026'].channelComplete?fmt(DATA['2026'].channels[c]||0):'—'}</td>`).join('')}<td>${fmt(DATA['2026'].total)}</td></tr>`;
 $('compare-body').innerHTML+=`<tr class="same-period-row"><td>2025 同期</td>${channels.map(c=>`<td>${fmt(previous.channels[c])}</td>`).join('')}<td>${fmt(previous.total)}</td></tr><tr class="yoy-row"><td>同比变化</td>${channels.map(c=>`<td>${yoy(DATA['2026'].channels[c]||0,previous.channels[c])}</td>`).join('')}<td>${yoy(DATA['2026'].total,previous.total)}</td></tr>`;
 $('period').innerHTML+=`<span>同比：2026-01-01 ~ ${DATA['2026'].asOf} / 2025-01-01 ~ ${previous.cutoff}</span>`;
 $('compare-total').textContent='2025 全年 '+fmt(DATA['2025'].total)+' 亿元；2025 同期 '+fmt(previous.total)+' 亿元；2026 累计 '+fmt(DATA['2026'].total)+' 亿元。';
 const groupNames=DATA['2026'].groups.filter(g=>g.name!=='其他待归类').map(g=>g.name);
 const groupPairs=groupNames.map(name=>{const full=DATA['2025'].groups.find(g=>g.name===(name==='汽车融资租赁'?'融资租赁':name))||{name,total:0,count:0};const current=DATA['2026'].groups.find(g=>g.name===name)||{name,total:0,count:0};return {full,current,same:previous.groups[full.name]||0,sameCount:previous.groupCounts[full.name]||0};});
 const groupMax=Math.max(...groupPairs.flatMap(p=>[p.same,p.current.total]),1);
 $('group-compare-chart').innerHTML=groupPairs.map(p=>`<div class="group-compare-row"><div class="group-compare-name">${p.full.name===p.current.name?esc(p.full.name):'<span>2025 · 融资租赁</span><span>2026 · 汽车融资租赁</span>'}</div><div class="group-compare-bars"><button class="group-year-bar" data-detail-year="2025" data-detail-cutoff="${previous.cutoff}" data-group="${esc(p.full.name)}" style="--color:#9aadc1"><span class="group-year">2025</span><span class="group-year-track"><span style="width:${p.same/groupMax*100}%"></span></span><b class="group-year-value">${fmt(p.same)}</b><span class="group-year-pct">${pct(p.same,previous.total)}</span><span class="group-year-count">${p.sameCount} 期</span></button><button class="group-year-bar" data-detail-year="2026" data-group="${esc(p.current.name)}" style="--color:#285f9e"><span class="group-year">2026</span><span class="group-year-track"><span style="width:${p.current.total/groupMax*100}%"></span></span><b class="group-year-value">${fmt(p.current.total)}</b><span class="group-year-pct">${pct(p.current.total,DATA['2026'].total)}</span><span class="group-year-count">${p.current.count} 期</span></button><div class="group-yoy"><span>2025 全年 ${fmt(p.full.total)} 亿 · ${p.full.count} 期</span><span>2025 同期 ${fmt(p.same)} 亿 · ${p.sameCount} 期</span><b>${p.full.name==='融资租赁'?'租赁类别同比':'同比'} ${yoy(p.current.total,p.same)}</b></div></div></div>`).join('');
 $('source').textContent='数据来源：2025 年台账及 2026 年 10 月 30 日定稿台账';
}
function showProjects(asset,channel,group,detailYear=year,cutoff=null){
 const d=DATA[detailYear],records=d.records.filter(p=>(!asset||p.asset===asset)&&(!channel||p.channel===channel)&&(!group||p.group===group)&&(!cutoff||p.date<=cutoff));
 $('dialog-title').textContent=detailYear+' 年'+(cutoff?' 同期':'')+' · '+(group||asset||'全部资产')+(channel?' / '+channel:'');
 $('dialog-subtitle').textContent=records.length+' 期项目 · 累计 '+fmt(records.reduce((s,p)=>s+p.scale,0))+' 亿元'+(!d.channelComplete?' · 发行场所待补充':'');
 $('project-body').innerHTML=records.length?records.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.asset)}</td><td>${esc(p.venue||'待补充')}</td><td>${p.date}</td><td>${fmt(p.scale)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">'+(d.channelComplete?'此筛选下没有发行项目。':'该年缺少发行场所，暂无法按渠道筛选项目。')+'</td></tr>';
 $('projects').showModal();
}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-group]');if(g){showProjects(null,null,g.dataset.group,g.dataset.detailYear||year,g.dataset.detailCutoff||null);return;}
 const p=e.target.closest('[data-asset],[data-channel]');if(p&&year!=='compare'){showProjects(p.dataset.asset,p.dataset.channel);}
});
$('search').addEventListener('input',renderChart);$('chart-sort').addEventListener('change',e=>{sort=e.target.value;renderChart();});$('close-dialog').addEventListener('click',()=>$('projects').close());
$('projects').addEventListener('click',e=>{if(e.target===$('projects')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
$('issuance-year').addEventListener('change',e=>{year=e.target.value;render();});
render();
</script>
</body>
</html>
