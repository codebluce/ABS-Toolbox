<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消金ABS</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#152b43;font:13px/1.5 'PingFang SC','Microsoft YaHei',sans-serif}.controls{padding:16px 28px 0;max-width:1440px;margin:auto}.tabs{display:inline-flex;padding:4px;background:#dfe8f0;gap:4px;border-radius:7px}.tabs button{border:0;padding:8px 18px;background:none;border-radius:5px;font:inherit;color:#52677d;cursor:pointer}.tabs button[aria-selected=true]{background:#152b43;color:#fff}button:focus-visible{outline:3px solid #62a4c3;outline-offset:3px}iframe{display:block;width:100%;height:calc(100vh - 70px);min-height:540px;border:0}iframe[hidden]{display:none}@media(max-width:600px){.controls{padding:14px 12px 0}.tabs button{padding:7px 14px}iframe{height:calc(100vh - 65px)}}
</style></head><body><div class="controls"><div class="tabs" role="tablist" aria-label="ABS统计口径"><button id="issuance-tab" role="tab" aria-selected="true" aria-controls="abs-issuance-frame" data-view="issuance">ABS发行规模</button><button id="balance-tab" role="tab" aria-selected="false" aria-controls="abs-balance-frame" data-view="balance">ABS存量余额</button></div></div><iframe id="abs-issuance-frame" title="ABS发行规模"></iframe><iframe id="abs-balance-frame" title="ABS存量余额" hidden></iframe><script id="consumer-abs-data" type="application/json">__DATA__</script><script>
'use strict';const P=JSON.parse(document.getElementById('consumer-abs-data').textContent);let active='issuance';
for(const kind of ['issuance','balance']){const frame=document.getElementById('abs-'+kind+'-frame');frame.addEventListener('load',()=>{if(active===kind)frame.contentWindow.dispatchEvent(new Event('resize'));});frame.srcdoc=P[kind];}
function select(kind){active=kind;for(const view of ['issuance','balance']){document.getElementById(view+'-tab').setAttribute('aria-selected',String(kind===view));document.getElementById('abs-'+view+'-frame').hidden=kind!==view;}const frame=document.getElementById('abs-'+kind+'-frame');frame.contentWindow.dispatchEvent(new Event('resize'));}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.view)));document.querySelector('.tabs').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const next=active==='issuance'?'balance':'issuance';select(next);document.getElementById(next+'-tab').focus();}});
</script></body></html>
