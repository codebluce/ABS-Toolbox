<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风险表现</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#152b43;font:13px/1.5 'PingFang SC','Microsoft YaHei',sans-serif}header{padding:16px 28px;background:#fff;border-bottom:1px solid #e1e8ef;display:flex;align-items:center;justify-content:space-between}header b{font-size:18px}header span{font-size:11px;color:#6c7c8d}.control-wrap{max-width:1440px;margin:auto;padding:18px 28px 0}.controls{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.tabs{display:flex;padding:4px;background:#dfe8f0;gap:4px;border-radius:7px}.tabs button{border:0;padding:8px 18px;background:none;border-radius:5px;font:inherit;color:#52677d;cursor:pointer}.tabs button[aria-selected=true]{background:#152b43;color:#fff}.filters{display:flex;align-items:center;gap:16px;flex-wrap:wrap}label{font-size:12px;color:#6c7c8d}select{font:inherit;color:#152b43;padding:7px 10px;border:1px solid #d9e3ec;border-radius:6px;background:white}.context{margin-top:14px;display:flex;gap:20px;flex-wrap:wrap;font-size:11px;color:#6c7c8d}.context b{color:#152b43;font-weight:500}.canvas{max-width:1440px;margin:auto}iframe{display:block;width:100%;height:calc(100vh - 175px);min-height:600px;border:0}iframe[hidden]{display:none}button:focus-visible,select:focus-visible{outline:3px solid #62a4c3;outline-offset:3px}@media(max-width:600px){header{padding:14px 16px}.control-wrap{padding:14px 12px 0}.controls{gap:12px}.filters{gap:10px}.context{gap:5px 12px;margin-top:10px}.tabs button{padding:7px 16px}iframe{height:calc(100vh - 230px);min-height:540px}}
</style></head><body><div class="control-wrap"><div class="controls"><div class="tabs" role="tablist" aria-label="数据口径"><button id="dynamic-tab" role="tab" data-kind="dynamic" aria-selected="true" aria-controls="dynamic-frame">动态池</button><button id="static-tab" role="tab" data-kind="static" aria-selected="false" aria-controls="static-frame">静态池</button></div><div class="filters"><label>资产 <select id="asset"><option value="all">全部资产</option><option>白条</option><option>金条</option><option>白条取现</option><option>现金贷</option></select></label><label>披露时点 <select id="period"></select></label></div></div><div class="context" id="context"></div></div><div class="canvas"><iframe id="dynamic-frame" title="动态池资产质量"></iframe><iframe id="static-frame" title="静态池资产质量" hidden></iframe></div><script id="quality-data" type="application/json">__DATA__</script><script>
'use strict';const D=JSON.parse(document.getElementById('quality-data').textContent),$=id=>document.getElementById(id);let kind='dynamic',asset='all';const times={dynamic:D.periods.dynamic.length-1,static:D.periods.static.length-1};const ready={dynamic:false,static:false};
function apply(){if(ready[kind])$(kind+'-frame').contentWindow.setQualityControls(times[kind],asset);}
function render(){document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.kind===kind)));for(const k of ['dynamic','static'])$(k+'-frame').hidden=k!==kind;const periods=D.periods[kind];$('period').innerHTML=periods.map((p,i)=>`<option value="${i}" ${i===times[kind]?'selected':''}>${p.date.slice(0,7)}</option>`).reverse().join('');$('context').innerHTML=kind==='dynamic'?'<b>动态池 · 账单口径／核销后</b><span>余额、逾期率、不良率</span><span>最新披露 2026-06</span>':'<b>静态池 · 对外披露口径</b><span>逾期率、不良率、年化不良率</span><span>最新披露 2025-12</span>';apply();}
for(const k of ['dynamic','static']){const frame=$(k+'-frame');frame.addEventListener('load',()=>{ready[k]=true;if(k===kind)apply();});frame.srcdoc=D.pages[k];}
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;render();}));$('asset').addEventListener('change',e=>{asset=e.target.value;apply();});$('period').addEventListener('change',e=>{times[kind]=+e.target.value;apply();});document.querySelector('.tabs').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const next=kind==='dynamic'?'static':'dynamic';$(next+'-tab').click();$(next+'-tab').focus();}});render();
</script></body></html>
